<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NGƯỜI QUE ĐẠI CHIẾN</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="background-details">
        <div class="stars"></div>
        <div class="mountain"></div>
    </div>
    
    <!-- Fantasy Elements -->
    <div class="fantasy-element sword">
        <i class="fas fa-sword"></i>
    </div>
    <div class="fantasy-element shield">
        <i class="fas fa-shield-alt"></i>
    </div>
    <div class="fantasy-element dragon">
        <i class="fas fa-dragon"></i>
    </div>
    <div class="fantasy-element castle">
        <i class="fas fa-chess-rook"></i>
    </div>

    <div class="container">
        <h1 class="game-title">NGƯỜI QUE ĐẠI CHIẾN</h1>
        <p class="subtitle">MADE BY CHATGPT AND DEEPSEEK</p>
        
        <div class="menu">
            <button class="menu-btn" onclick="window.location.href='singleplayer.html'">
                <i class="btn-icon fas fa-user"></i> Singleplayer
            </button>
            <button class="menu-btn" onclick="window.location.href='multiplayer.html'">
                <i class="btn-icon fas fa-users"></i> Multiplayer
            </button>
        </div>
    </div>

    <div class="footer">
        <p>Version 1.0</p>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
